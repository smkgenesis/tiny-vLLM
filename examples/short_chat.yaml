# Synthetic short-length profile, not a collected chat trace.
model: {num_layers: 1, kv_heads: 1, head_dim: 8, dtype_bytes: 2}
scheduler: {max_tokens_per_step: 32, prefill_chunk_tokens: 16, max_active_requests: 4}
kv_cache: {block_tokens: 16, pool_blocks: 64}
driver: {transaction_bytes: 64, max_outstanding: 16, max_backend_cycles: 100000}
requests:
  - {id: A, arrival_step: 0, prompt_tokens: 32, output_tokens: 8}
  - {id: B, arrival_step: 0, prompt_tokens: 32, output_tokens: 8}
  - {id: C, arrival_step: 0, prompt_tokens: 32, output_tokens: 8}
  - {id: D, arrival_step: 0, prompt_tokens: 32, output_tokens: 8}
